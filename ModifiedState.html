<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #f4faf7, #fdfdfb);
      color: #333;
      margin: 0;
      min-height: 100vh;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 12px 32px;
      background: rgba(253, 253, 251, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e8f0eb;
    }

    .brand {
      font-weight: bold;
      font-size: 16px;
      color: #1a1a1a;
      text-decoration: none;
    }

    .brand span {
      color: #4a9d7f;
    }

    .nav-links {
      display: flex;
      gap: 6px;
    }

    .nav-links a {
      display: inline-block;
      color: #4a9d7f;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: #eefaf4;
      color: #3d8a6e;
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px 72px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e8f0eb;
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 2px 16px rgba(26, 61, 46, 0.05);
    }

    .avatar {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: #eefaf4;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    .tag {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4a9d7f;
      background: #eefaf4;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 34px;
      color: #1a1a1a;
      margin: 0 0 14px;
    }

    .lead {
      line-height: 1.8;
      color: #555;
      margin: 0;
    }

    h2 {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8aa79b;
      margin: 36px 0 14px;
    }

    .hobbies {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hobbies span {
      background: #f3fbf7;
      border: 1px solid #e0f2ea;
      color: #3d8a6e;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
    }

    .contact a {
      display: block;
      color: #4a9d7f;
      text-decoration: none;
      line-height: 2.2;
      font-size: 15px;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .navbar {
        padding: 10px 20px;
      }

      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="index.html">My <span>Site</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ModifiedState.html" class="active">About</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <main class="page">
    <section class="card">
      <div class="avatar">👋</div>
      <span class="tag">About Me</span>
      <h1>Hello, I'm Your Name</h1>
      <p class="lead">Hi! I'm a student who loves technology and building things for the web.</p>

      <h2>Hobbies</h2>
      <div class="hobbies">
        <span>🎮 Gaming</span>
        <span>📚 Reading</span>
        <span>💻 Coding</span>
        <span>🎵 Music</span>
      </div>

      <h2>Contact</h2>
      <div class="contact" id="contact">
        <a href="mailto:kristkarlvzabaldica@example.com">✉️ kristkarlvzabaldica@example.com</a>
        <a href="https://github.com/Karldxc" target="_blank" rel="noopener">🐙 github.com/Karldxc</a>
      </div>
    </section>
  </main>
</body>
</html>
